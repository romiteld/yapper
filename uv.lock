[[package]]
name = "yapper"
version = "4.0.0"
source = { editable = "." }
dependencies = [
    { name = "desktop-notifier" },
    { name = "numpy", version = "2.2.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
    { name = "openai" },
    { name = "pillow" },
    { name = "pynput" },
    { name = "pyperclip" },
    { name = "pyside6" },
    { name = "rapidfuzz" },
    { name = "sounddevice" },
]

[package.optional-dependencies]
dev = [
    { name = "pyinstaller" },
    { name = "pytest" },
    { name = "pytest-qt" },
]
local = [
    { name = "faster-whisper", marker = "sys_platform != 'darwin'" },
    { name = "mlx-whisper", marker = "platform_machine == 'arm64' and sys_platform == 'darwin'" },
]
macos = [
    { name = "pyobjc-framework-applicationservices", marker = "sys_platform == 'darwin'" },
    { name = "pyobjc-framework-quartz", marker = "sys_platform == 'darwin'" },
]

[package.metadata]
requires-dist = [
    { name = "desktop-notifier", specifier = ">=6.1.1" },
    { name = "faster-whisper", marker = "sys_platform != 'darwin' and extra == 'local'", specifier = ">=1.1.0" },
    { name = "mlx-whisper", marker = "platform_machine == 'arm64' and sys_platform == 'darwin' and extra == 'local'", specifier = ">=0.4.2" },
    { name = "numpy", specifier = ">=2.2.6" },
    { name = "openai", specifier = ">=2.38" },
    { name = "pillow", specifier = ">=11.0" },
    { name = "pyinstaller", marker = "extra == 'dev'", specifier = ">=6.11" },
    { name = "pynput", specifier = ">=1.8.2" },
    { name = "pyobjc-framework-applicationservices", marker = "sys_platform == 'darwin' and extra == 'macos'", specifier = ">=10.3" },
    { name = "pyobjc-framework-quartz", marker = "sys_platform == 'darwin' and extra == 'macos'", specifier = ">=10.3" },
    { name = "pyperclip", specifier = ">=1.9.0" },
    { name = "pyside6", specifier = ">=6.8" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.3" },
    { name = "pytest-qt", marker = "extra == 'dev'", specifier = ">=4.4" },
    { name = "rapidfuzz", specifier = ">=3.10" },
    { name = "sounddevice", specifier = ">=0.5.1" },
]
provides-extras = ["local", "macos", "dev"]
