name: Notify Portfolio Indexer

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio indexer
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_PAT }}" \
            https://api.github.com/repos/romiteld/portfolio/dispatches \
            -d "{\"event_type\":\"repo-updated\",\"client_payload\":{\"repo\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\"}}"
